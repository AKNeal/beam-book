<title>Beam · Offline</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#0d1014;color:#f4f6f8;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}

  h1{font-size:24px;margin:18px 0 6px}
  p{margin:0 0 22px;color:#aab3bd;max-width:320px}

<main>
  <img src="/assets/brand/beam-icon-192.png" alt="">

  <button type="button" onclick="location.reload()">Try again</button>
