<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1014">
<link rel="icon" href="/assets/brand/beam-icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/shop.js"></script>
<title>Apprenticeship application | %SHOP%</title>
<meta name="description" content="Apply for the barber apprenticeship. No experience needed.">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="page header-inner">
    <a class="brand" href="/"><img data-shop="logo" src="" alt="" width="46" height="46" hidden><span class="brand-mono" hidden></span><span data-shop="name"></span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="/artists">Team</a>
      <a data-shop="website" data-shop-if="website" href="#" rel="noopener" hidden>Shop website</a>
      <a class="btn sign sm" href="/booking" data-word="cta">Request a booking</a>
    </nav>
  </div>
</header>
<main id="main">
  <div class="page" style="max-width:760px">
    <header class="page-head">
      <h1>Apply for the apprenticeship</h1>
      <p class="intro">No experience needed, just the drive to get better every day. Fill this in and the shop will reach out.</p>
    </header>
    <form id="apply" class="form" novalidate>
      <div class="hp" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="field" data-f="first"><label for="f-first">First name</label><input id="f-first" name="first" type="text" autocomplete="given-name" maxlength="60" required><div class="err"></div></div>
      <div class="field" data-f="last"><label for="f-last">Last name</label><input id="f-last" name="last" type="text" autocomplete="family-name" maxlength="60" required><div class="err"></div></div>
      <div class="field" data-f="email"><label for="f-email">Email</label><input id="f-email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="120" required><div class="err"></div></div>
      <div class="field" data-f="phone"><label for="f-phone">Phone</label><input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" required><div class="err"></div></div>
      <div class="field" data-f="about"><label for="f-about">Tell us about yourself <span class="hint">Optional. Why barbering, any experience, when you could start.</span></label><textarea id="f-about" name="about" rows="4" maxlength="1500"></textarea><div class="err"></div></div>
      <p class="form-error" id="formErr" role="alert" hidden></p>
      <button class="btn sign" type="submit">Submit application</button>
    </form>
    <div id="done" hidden>
      <h2>Thanks, we got your application.</h2>
      <p>The shop will reach out by phone or email.</p>
    </div>
  </div>
<p class="poweredby"><a href="https://beam.nealmedia.app" rel="noopener" target="_blank">Powered by: <img class="pb-on-dark" src="/assets/brand/beam-logo.svg" alt="Beam" width="76" height="22"><img class="pb-on-light" src="/assets/brand/beam-logo-dark-text.svg" alt="Beam" width="76" height="22"></a></p></main>
<footer class="site-footer">
  <div class="page">
    <div class="footer-grid">
      <div>
        <a class="brand" href="/"><img data-shop="logo" src="" alt="" width="46" height="46" hidden><span class="brand-mono" hidden></span><span data-shop="name"></span></a>
        <p class="muted" style="margin-top:14px;max-width:30ch" data-shop="tagline"></p>
      </div>
      <div data-shop-if="address" hidden>
        <h4>Visit</h4>
        <ul><li><a data-shop="address" href="#" rel="noopener"></a></li></ul>
      </div>
      <div data-shop-if="phone|instagram|website" hidden>
        <h4>Contact</h4>
        <ul>
          <li data-shop-if="phone" hidden><a data-shop="phone" href="#"></a></li>
          <li data-shop-if="instagram" hidden><a data-shop="instagram" href="#" rel="noopener"></a></li>
          <li data-shop-if="website" hidden><a data-shop="website" href="#" rel="noopener"></a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© <span data-shop="year"></span> <span data-shop="name"></span></span>
    </div>
  </div>
</footer>
<script src="/assets/site.js" defer></script>
<script src="/assets/common.js"></script>
<script>
(function () {
  var f = document.getElementById("apply"), err = document.getElementById("formErr");
  f.addEventListener("submit", async function (e) {
    e.preventDefault();
    f.querySelectorAll(".field").forEach(function (x) { x.classList.remove("invalid"); });
    err.hidden = true;
    var body = { action: "apprApply" };
    new FormData(f).forEach(function (v, k) { body[k] = String(v); });
    var btn = f.querySelector("button"); btn.disabled = true;
    try {
      var r = await fetch("/api/status", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok) {
        Object.entries(d.fields || {}).forEach(function (kv) { var x = f.querySelector('[data-f="' + kv[0] + '"]'); if (x) { x.classList.add("invalid"); x.querySelector(".err").textContent = kv[1]; } });
        err.textContent = d.error || "Something went wrong. Please try again."; err.hidden = false; btn.disabled = false; return;
      }
      f.hidden = true; document.getElementById("done").hidden = false; window.scrollTo(0, 0);
    } catch (x) { err.textContent = "Couldn't send. Check your connection and try again."; err.hidden = false; btn.disabled = false; }
  });
})();
</script>
</body>
</html>
