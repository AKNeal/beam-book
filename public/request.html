<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1014">
<link rel="icon" href="/assets/brand/beam-icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/shop.js"></script>
<meta name="robots" content="noindex">
<title>Your request | %SHOP%</title>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="page header-inner">
    <a class="brand" href="/"><img data-shop="logo" src="" alt="" width="46" height="46" hidden><span class="brand-mono" hidden></span><span data-shop="name"></span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="/artists">Team</a>
      <a data-shop="website" data-shop-if="website" href="#" rel="noopener" hidden>Shop website</a>
      <a class="btn sign sm" href="/booking" data-word="cta">Request a booking</a>
    </nav>
  </div>
</header>
<main id="main"><div class="page" style="max-width:760px"><div class="page-head" id="status"><p class="muted">Loading your request…</p></div></div><p class="poweredby"><a href="https://beam.nealmedia.app" rel="noopener" target="_blank">Powered by: <img class="pb-on-dark" src="/assets/brand/beam-logo.svg" alt="Beam" width="76" height="22"><img class="pb-on-light" src="/assets/brand/beam-logo-dark-text.svg" alt="Beam" width="76" height="22"></a></p></main>
<footer class="site-footer">
  <div class="page">
    <div class="footer-grid">
      <div>
        <a class="brand" href="/"><img data-shop="logo" src="" alt="" width="46" height="46" hidden><span class="brand-mono" hidden></span><span data-shop="name"></span></a>
        <p class="muted" style="margin-top:14px;max-width:30ch" data-shop="tagline"></p>
      </div>
      <div data-shop-if="address" hidden>
        <h4>Visit</h4>
        <ul><li><a data-shop="address" href="#" rel="noopener"></a></li></ul>
      </div>
      <div data-shop-if="phone|instagram|website" hidden>
        <h4>Contact</h4>
        <ul>
          <li data-shop-if="phone" hidden><a data-shop="phone" href="#"></a></li>
          <li data-shop-if="instagram" hidden><a data-shop="instagram" href="#" rel="noopener"></a></li>
          <li data-shop-if="website" hidden><a data-shop="website" href="#" rel="noopener"></a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© <span data-shop="year"></span> <span data-shop="name"></span></span>
    </div>
  </div>
</footer>
<script src="/assets/site.js" defer></script>
<script src="/assets/common.js"></script>
<script>
(() => {
  const { api, el, date } = BW;
  const main = document.getElementById("status");
  const q = new URLSearchParams(location.search);
  const id = q.get("id") || "", t = q.get("t") || "";
  const link = (p) => `${p}?id=${encodeURIComponent(id)}&t=${encodeURIComponent(t)}`;
  const when = (iso) => new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const post = (action, extra = {}) => api("/api/status", { body: { id, t, action, ...extra } });
  const hrs = (m) => (m % 60 ? `${(m / 60).toFixed(1)} hours` : `${m / 60} hour${m === 60 ? "" : "s"}`);
  const dayText = (d, tm) => { if (!d) return ""; const [y, mo, da] = d.split("-").map(Number); const dt = new Date(y, mo - 1, da);
    let out = dt.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
    if (tm) { const [h, mi] = tm.split(":").map(Number); out += ` at ${new Date(2000, 0, 1, h, mi).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}`; }
    return out; };

  // The terms of one offer, as a list.
  function terms(o) {
    const dl = el("dl", { class: "facts" });
    const add = (k, v) => { if (v) dl.append(el("dt", {}, k), el("dd", { style: "white-space:pre-wrap" }, v)); };
    add("Price", o.price); add("When", dayText(o.date, o.time)); add("Length", o.durationMin ? hrs(o.durationMin) : "");
    add("Included", o.scope); add("Terms", o.terms); add("Deposit", o.deposit);
    if (o.note) dl.append(el("dt", {}, "Note"), el("dd", { style: "white-space:pre-wrap" }, o.note));
    return dl;
  }

  function counterForm(s, o, err, render) {
    const N = s.negotiate || {};
    const box = el("form", { class: "act-box", hidden: true });
    const f = (label, input, hint) => el("div", { class: "field" }, el("label", {}, label), input, hint ? el("p", { class: "hint" }, hint) : null);
    const inputs = {};
    if (N.price) box.append(f("Your price", inputs.price = el("input", { type: "text", inputmode: "decimal", value: o.price || "", maxlength: 40 })));
    if (N.datetime) {
      inputs.date = el("input", { type: "date", value: o.date || "", min: new Date().toISOString().slice(0, 10) });
      inputs.time = el("input", { type: "time", value: o.time || "", step: 900 });
      inputs.durationMin = el("select", {}, el("option", { value: "" }, "Choose"), (s.sessionLengths || []).map((m) => el("option", { value: m, selected: m === o.durationMin }, hrs(m))));
      box.append(el("div", { class: "row" }, f("Date", inputs.date), f("Start time", inputs.time)), f("How long", inputs.durationMin));
    }
    if (N.scope) box.append(f("What's included", inputs.scope = el("textarea", { rows: 3, maxlength: 1500 }, o.scope || "")));
    if (N.terms) {
      box.append(f("Terms", inputs.terms = el("textarea", { rows: 2, maxlength: 1500 }, o.terms || "")));
      box.append(f("Deposit", inputs.deposit = el("input", { type: "text", value: o.deposit || "", maxlength: 120 })));
    }
    const note = el("textarea", { rows: 2, maxlength: 1500 });
    box.append(f("Message (optional)", note),
      el("div", { class: "actions", style: "margin:0" }, el("button", { class: "btn sign", type: "submit" }, "Send counter-offer"),
        el("button", { class: "btn line", type: "button", onclick: () => { box.hidden = true; } }, "Cancel")));
    box.addEventListener("submit", async (e) => {
      e.preventDefault(); err.hidden = true;
      const body = { message: note.value };
      for (const [k, i] of Object.entries(inputs)) body[k] = i.value;
      try { render(await post("counter", body)); window.scrollTo({ top: 0 }); } catch (x) { err.textContent = x.message; err.hidden = false; }
    });
    return box;
  }

  function render(s) {
    const W = s.words || {};
    const NAMES = { new: "Request received", quoted: "Offer", agreed: "Agreed", scheduling: "Pick your time", pending: "Waiting for confirmation", booked: "Booked", done: "Done" };
    const who = s.artist.startsWith("the ") ? ((BW.shop && BW.shop.name) || "the business") : s.artist.split(" ")[0];
    const Who = who.charAt(0).toUpperCase() + who.slice(1);
    main.textContent = "";
    main.append(el("h1", {}, "Your request"), el("p", { class: "intro" }, `With ${s.artist}, sent ${date(s.createdAt)}.`));
    if (s.status === "declined") {
      main.append(el("div", { class: "panel", style: "margin-top:28px" }, el("h3", {}, "Not going ahead"),
        el("p", {}, s.message || "This request isn't going ahead. You're welcome to send a new one."), el("a", { class: "btn", href: "/booking" }, "Send a new request")));
    } else {
      const steps = s.steps.filter((st) => st !== "pending" || s.status === "pending");
      const idx = steps.indexOf(s.status === "agreed" ? "quoted" : s.status);
      main.append(el("ol", { class: "track", "aria-label": "Progress" }, steps.map((st, i) =>
        el("li", { class: i < idx ? "past" : i === idx ? "now" : "", "aria-current": i === idx ? "step" : null }, NAMES[st]))));
      const box = el("div", { class: "panel" });
      const open = (s.offers || []).find((o) => o.status === "open");
      const err = el("p", { class: "form-error", role: "alert", hidden: true });

      if (open && open.from === "shop") {
        box.append(el("h3", {}, `${Who} sent you an offer`), terms(open));
        const decline = el("div", { hidden: true, class: "act-box" },
          el("div", { class: "field" }, el("label", { for: "whyNot" }, `Want to tell ${who} why? `, el("span", { class: "opt" }, "(optional)")), el("textarea", { id: "whyNot", rows: 3 })),
          el("div", { class: "actions", style: "margin:0" },
            el("button", { class: "btn danger", type: "button", onclick: async (e) => { e.target.disabled = true; try { render(await post("decline", { message: document.getElementById("whyNot").value })); } catch (x) { err.textContent = x.message; err.hidden = false; e.target.disabled = false; } } }, "Turn it down"),
            el("button", { class: "btn line", type: "button", onclick: () => { decline.hidden = true; } }, "Keep it")));
        const counter = s.canCounter ? counterForm(s, open, err, render) : null;
        box.append(el("div", { class: "actions" },
            el("button", { class: "btn sign", type: "button", onclick: async (e) => {
              e.target.disabled = true; err.hidden = true;
              try { const r = await post("accept"); if (r.scheduleUrl) location.href = r.scheduleUrl; else render(r); }
              catch (x) { err.textContent = x.message; err.hidden = false; e.target.disabled = false; } } }, "Accept offer"),
            counter ? el("button", { class: "btn line", type: "button", onclick: () => { counter.hidden = false; decline.hidden = true; } }, "Counter-offer") : null,
            el("a", { class: "btn line", href: "#ask" }, "Ask a question"),
            el("button", { class: "linkbtn", type: "button", onclick: () => { decline.hidden = false; if (counter) counter.hidden = true; } }, "Turn it down")),
          counter, decline, err);
      } else if (open && open.from === "you") {
        box.append(el("h3", {}, "Your offer is waiting for a reply"), terms(open), el("p", { class: "muted", style: "margin-bottom:0" }, `${Who} can accept it, counter or ask you about it. You'll get an email when they do.`));
      } else if (s.agreed && !["booked", "done"].includes(s.status)) {
        box.append(el("h3", {}, "You've agreed"), terms(s.agreed));
      } else if (s.canAccept && s.quote) { // older quotes without offers
        box.append(el("p", {}, el("strong", {}, "Quote: "), s.quote),
          el("div", { class: "actions" }, el("button", { class: "btn sign", type: "button", onclick: async () => { try { const r = await post("accept"); if (r.scheduleUrl) location.href = r.scheduleUrl; else render(r); } catch (x) { err.textContent = x.message; err.hidden = false; } } }, "Accept")), err);
      }
      if (s.message) box.append(el("p", {}, s.message));
      if (s.when) box.append(el("p", {}, el("strong", {}, s.status === "pending" ? "Time you asked for: " : "Booked for: "), s.when));
      if (s.status === "pending") box.append(el("p", {}, `It's held for you. ${Who} will confirm it soon, and this page will say Booked once they do.`));
      if (s.status === "agreed") box.append(el("p", {}, `${Who} will set the time with you.`));
      if (s.canSchedule) box.append(el("p", {}, "You're approved. Pick any open time that works for you."), el("a", { class: "btn sign", href: link("/schedule") }, "Pick your time"));
      if (s.depositUrl && ["scheduling", "booked"].includes(s.status)) box.append(el("p", { style: "margin-top:14px" }, el("a", { href: s.depositUrl, rel: "noopener" }, `Pay ${s.deposit || "your"} deposit online`)));
      if (s.hasCalendarFile) box.append(el("div", { class: "actions" }, el("a", { class: "btn", href: link("/api/schedule") + "&ics=1" }, "Add to my calendar"),
        (BW.shop && BW.shop.address ? el("a", { class: "btn line", href: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(BW.shop.address)}`, rel: "noopener" }, "Directions") : null)));
      if (s.status === "done") box.replaceChildren(el("p", {}, "All done. Thanks for booking with us!"), el("div", { class: "actions", style: "margin-bottom:0" }, el("a", { class: "btn", href: "#photos" }, "Add photos")));
      if (!box.childNodes.length) box.append(el("p", { style: "margin:0" }, `${Who} hasn't replied yet. You'll hear back soon.`));
      main.append(box);

      // Earlier offers
      const past = (s.offers || []).filter((o) => o.status !== "open");
      if (past.length) {
        const STATE = { accepted: "accepted", countered: "countered", declined: "turned down", withdrawn: "withdrawn" };
        main.append(el("details", { style: "margin-top:20px" }, el("summary", {}, `Offer history (${past.length})`),
          el("ol", { class: "small", style: "padding-left:20px" }, past.map((o) => el("li", { style: "margin:6px 0" },
            `${o.from === "you" ? "You" : Who} offered ${o.summary} — ${STATE[o.status] || o.status}, ${when(o.at)}`)))));
      }
    }

    // Photos (client and business can both add once it's done)
    if (s.status === "done" || s.donePhotos.length) {
      const sec = el("section", { id: "photos", style: "margin-top:32px" }, el("h2", { style: "font-size:1.75rem" }, "Photos"));
      if (s.donePhotos.length) sec.append(el("div", { class: "done-pics" }, s.donePhotos.map((ph, i) =>
        el("a", { href: ph.url, target: "_blank", rel: "noopener" }, el("img", { src: ph.url, alt: `Photo ${i + 1}${ph.byYou ? " (added by you)" : ""}`, loading: "lazy" })))));
      else sec.append(el("p", { class: "muted" }, "Add a photo of the finished work."));
      if (s.canAddPhotos) {
        const input = el("input", { type: "file", accept: "image/*", multiple: true, id: "donePhotos", class: "visually-hidden" });
        const msg = el("p", { role: "status", class: "small", style: "margin:8px 0 0" });
        input.addEventListener("change", async () => {
          const list = [...input.files].slice(0, 4); input.value = "";
          if (!list.length) return;
          msg.textContent = `Uploading ${list.length} photo${list.length > 1 ? "s" : ""}…`;
          try {
            const images = []; for (const f of list) images.push(await BW.shrink(f));
            render(await post("addPhotos", { images })); setTimeout(() => document.getElementById("photos")?.scrollIntoView(), 0);
          } catch (x) { msg.textContent = x.message; }
        });
        sec.append(el("label", { class: "btn", for: "donePhotos", style: "margin-top:12px" }, s.donePhotos.length ? "Add more photos" : "Add photos"), input, msg,
          el("p", { class: "small muted", style: "margin-top:8px" }, "Up to 4 at a time. Only you and the business can see them."));
      }
      main.append(sec);
    }

    // Messages
    if (s.messages.length || s.canMessage) {
      const who2 = s.artist.startsWith("the ") ? ((BW.shop && BW.shop.name) || "the business") : s.artist.split(" ")[0];
      const sec = el("section", { id: "ask", style: "margin-top:32px" }, el("h2", { style: "font-size:1.75rem" }, s.messages.length ? "Messages" : "Questions?"));
      for (const m of s.messages) sec.append(el("div", { class: `msg ${m.from}` }, el("div", { class: "small muted" }, `${m.from === "you" ? "You" : s.artist.startsWith("the ") ? ((BW.shop && BW.shop.name) || "The business") : s.artist} · ${when(m.at)}`), el("div", { style: "white-space:pre-wrap" }, m.text)));
      if (s.canMessage) {
        const ta = el("textarea", { id: "q", rows: 3, maxlength: 1500, required: true });
        const err = el("p", { class: "form-error", role: "alert", hidden: true });
        const f = el("form", { class: "field", style: "margin-top:12px" }, el("label", { for: "q" }, `Ask ${who2} a question`), ta, err,
          el("button", { class: "btn", type: "submit", style: "margin-top:10px" }, "Send"));
        f.addEventListener("submit", async (e) => {
          e.preventDefault(); err.hidden = true; const btn = f.querySelector("button"); btn.disabled = true;
          try { render(await post("ask", { message: ta.value })); setTimeout(() => document.getElementById("ask")?.scrollIntoView(), 0); }
          catch (x) { err.textContent = x.message; err.hidden = false; btn.disabled = false; }
        });
        sec.append(f);
      }
      main.append(sec);
    }
    const facts = [`Your request: ${s.idea}`, ...(s.answers || []).map((a) => `${a.label}: ${a.value}`)];
    main.append(el("details", { style: "margin-top:24px" }, el("summary", { class: "muted small" }, "What you sent"), el("ul", { class: "small muted" }, facts.map((x) => el("li", {}, x)))));
  }

  api(`/api/status?id=${encodeURIComponent(id)}&t=${encodeURIComponent(t)}`).then(render).catch((e) => {
    main.textContent = "";
    main.append(el("h1", {}, "Request not found"), el("p", { class: "intro" }, e.message), el("p", {}, "Contact the business if you need help."));
  });
})();
</script>
</body>
</html>
