<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment</title>
<style>body{font:18px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:90vh;margin:0;padding:20px;text-align:center;color:#111}h1{font-size:32px;margin:0 0 8px}</style></head>
<body><main><h1 id="h">Paid. Thank you!</h1><p id="p">You can hand the phone back or close this page.</p></main>
<script>var q=new URLSearchParams(location.search);if(q.get("canceled")){document.getElementById("h").textContent="Payment canceled";document.getElementById("p").textContent="Nothing was charged. Let the shop know and they'll help.";}else if(q.get("shop")){document.getElementById("p").textContent="Thanks for coming to "+q.get("shop")+". You can close this page.";}</script>
</body></html>
